name: Publicar Scripts

# Manual (botão Run workflow) ou a cada 6 horas
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm install
        working-directory: ./

      # 1) Puxa 1 script novo do rscripts → pending-scripts.json
      - name: Puxar 1 script do rscripts
        run: node fetch-rscripts.js --limit=1

      # 2) Thumbnails dos que já estão no scripts-data
      - name: Resolver thumbnails dos jogos
        run: node resolve-thumbnails.js

      # 3) Pastefy + Shrtfly nos que ainda não têm link
      - name: Subir no Pastefy e encurtar no Shrtfly
        run: node shorten-and-publish.js
        env:
          PASTEFY_API_KEY: ${{ secrets.PASTEFY_API_KEY }}
          SHRTFLY_API_KEY: ${{ secrets.SHRTFLY_API_KEY }}

      # 4) Salva scripts-data + pending no repo
      - name: Salvar mudanças no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts-data.json pending-scripts.json
          git diff --staged --quiet || git commit -m "Atualiza scripts (rscripts + publish)"
          git push
