name: Publicar Scripts

# Manual (botão Run workflow) ou a cada 6 horas
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm install
        working-directory: ./

      # Top 20 Rolimons → 1 script/jogo no rscripts → pending
      - name: Puxar scripts dos jogos mais jogados
        run: node fetch-top-games.js --limit=20 --per-game=1
        continue-on-error: true

      # Puxada extra genérica (1 script recente keyless)
      - name: Puxar 1 script extra do rscripts
        run: node fetch-rscripts.js --limit=1
        continue-on-error: true

      - name: Resolver thumbnails dos jogos
        run: node resolve-thumbnails.js

      - name: Subir no Pastefy e encurtar no Shrtfly
        run: node shorten-and-publish.js
        env:
          PASTEFY_API_KEY: ${{ secrets.PASTEFY_API_KEY }}
          SHRTFLY_API_KEY: ${{ secrets.SHRTFLY_API_KEY }}

      - name: Salvar mudanças no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts-data.json pending-scripts.json
          git diff --staged --quiet || git commit -m "Atualiza scripts (top games + publish)"
          git push
